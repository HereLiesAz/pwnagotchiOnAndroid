name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  build-raspi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Build Raspi Executable (ARM)
        run: |
          docker run --rm -v ${{ github.workspace }}:/work -w /work/pwnagotchi_raspi --platform linux/arm/v7 python:3.9-slim-buster \
          bash -c "apt-get update && apt-get install -y binutils && pip install pyinstaller websockets && pyinstaller --onefile --name pwnagotchi_raspi main.py"

      - name: Upload Executable
        uses: actions/upload-artifact@v3
        with:
          name: pwnagotchi_raspi
          path: pwnagotchi_raspi/dist/pwnagotchi_raspi

  release:
    needs: [build-android, build-raspi]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v3

      - name: Download APK
        uses: actions/download-artifact@v3
        with:
          name: app-debug

      - name: Download Raspi Executable
        uses: actions/download-artifact@v3
        with:
          name: pwnagotchi_raspi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            app-debug.apk
            pwnagotchi_raspi
          prerelease: true
          generate_release_notes: true
